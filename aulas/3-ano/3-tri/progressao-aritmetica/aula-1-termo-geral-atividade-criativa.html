<title>Monte a P.A.: Arraste os Termos</title>
<style>
  :root{
    --bg:#F4F5FB; --surface:#FFFFFF; --surface-2:#ECEEFA;
    --ink:#14162B; --ink-soft:#54577A; --ink-faint:#8688AB;
    --line:#D8DAF0; --line-strong:#BEC1E8;
    --primary:#382EAE; --primary-ink:#FFFFFF; --primary-soft:#E7E4FB;
    --growth:#D9531A; --growth-soft:#FBE5D8; --growth-ink:#7A2E0C;
    --decay:#0B7C82; --decay-soft:#D9F1EF; --decay-ink:#0A4B4F;
    --success:#1C8A52; --success-soft:#DCF3E6;
    --danger:#C23B3B; --danger-soft:#FBE1E1;
    --shadow:rgba(24,26,60,.14); --shadow-soft:rgba(24,26,60,.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0C0D18; --surface:#15172A; --surface-2:#1C1E38;
      --ink:#EEEFFC; --ink-soft:#AEB1D6; --ink-faint:#7B7EA3;
      --line:#2B2D4D; --line-strong:#3B3E68;
      --primary:#9089F5; --primary-ink:#12102B; --primary-soft:#26224F;
      --growth:#FF8E56; --growth-soft:#3A2416; --growth-ink:#FFD3B4;
      --decay:#44D8CF; --decay-soft:#0F3634; --decay-ink:#AEF0EA;
      --success:#4ADE80; --success-soft:#123522;
      --danger:#FF7A7A; --danger-soft:#3A1717;
      --shadow:rgba(0,0,0,.55); --shadow-soft:rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0C0D18; --surface:#15172A; --surface-2:#1C1E38;
    --ink:#EEEFFC; --ink-soft:#AEB1D6; --ink-faint:#7B7EA3;
    --line:#2B2D4D; --line-strong:#3B3E68;
    --primary:#9089F5; --primary-ink:#12102B; --primary-soft:#26224F;
    --growth:#FF8E56; --growth-soft:#3A2416; --growth-ink:#FFD3B4;
    --decay:#44D8CF; --decay-soft:#0F3634; --decay-ink:#AEF0EA;
    --success:#4ADE80; --success-soft:#123522;
    --danger:#FF7A7A; --danger-soft:#3A1717;
    --shadow:rgba(0,0,0,.55); --shadow-soft:rgba(0,0,0,.35);
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html{ color-scheme:light dark; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Source Serif 4', Georgia, serif; -webkit-font-smoothing:antialiased;
    padding:20px 16px 60px;
    background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:34px 34px; background-position:center top;
    overscroll-behavior:none;
  }
  h1,h2,h3,.disp{ font-family:'Archivo','Arial Narrow',sans-serif; letter-spacing:-.01em; }
  .mono, .formula{ font-family:'JetBrains Mono','Courier New',monospace; }
  button{ font:inherit; }
  .app{ max-width:820px; margin:0 auto; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:.5em; font-size:.72rem; font-weight:700;
    letter-spacing:.09em; text-transform:uppercase; color:var(--primary); background:var(--primary-soft);
    border-radius:999px; padding:.36em .9em; margin-bottom:14px;
  }
  header.top{ text-align:center; margin-bottom:22px; }
  header.top h1{ font-size:clamp(1.7rem,4vw,2.4rem); font-weight:900; margin:0 0 8px; }
  .subtitle{ font-family:'Source Serif 4', serif; font-style:italic; color:var(--ink-soft); font-size:clamp(.92rem,1.4vw,1.05rem); margin:0 auto; max-width:56ch; }
  .card{ background:var(--surface-2); border:1px solid var(--line); border-radius:18px; padding:22px 24px; margin-bottom:18px; }
  .formula{ font-size:1rem; background:var(--surface); border:1.5px solid var(--line-strong); border-radius:12px; padding:10px 14px; display:inline-flex; align-items:center; gap:.35em; box-shadow:0 2px 0 var(--shadow-soft); }
  .badge{ display:inline-flex; align-items:center; gap:.4em; font-family:'JetBrains Mono',monospace; font-size:.72rem; font-weight:700; background:var(--surface); border:1px solid var(--line-strong); border-radius:8px; padding:.3em .6em; color:var(--ink-soft); }
  .score-pill{ position:sticky; top:14px; float:right; background:var(--surface); border:1.5px solid var(--line-strong); border-radius:999px; padding:.4em 1em; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:.82rem; box-shadow:0 4px 10px var(--shadow-soft); z-index:10; }
  .round-title{ font-size:1.05rem; font-weight:800; margin:0 0 4px; }
  .round-sub{ color:var(--ink-soft); font-size:.88rem; margin:0 0 16px; }
  .track{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin:18px 0; min-height:78px; }
  .slot{
    width:74px; height:66px; border:2px dashed var(--line-strong); border-radius:12px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    background:var(--surface); position:relative; transition:border-color .2s, background .2s;
  }
  .slot .slot-pos{ font-family:'JetBrains Mono',monospace; font-size:.62rem; color:var(--ink-faint); position:absolute; top:3px; left:6px; }
  .slot.filled{ border-style:solid; border-color:var(--success); background:var(--success-soft); }
  .slot.hover-ok{ border-color:var(--primary); background:var(--primary-soft); }
  .pool{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center; padding:16px; border-top:1px solid var(--line); margin-top:6px; min-height:70px; }
  .tile{
    width:66px; height:52px; border-radius:12px; border:1.5px solid var(--line-strong);
    background:var(--surface); display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:.95rem; color:var(--ink);
    cursor:grab; touch-action:none; user-select:none; box-shadow:0 3px 0 var(--shadow-soft);
    transition:box-shadow .15s, border-color .15s;
  }
  .tile:hover{ border-color:var(--primary); }
  .tile.dragging{ position:fixed; z-index:999; cursor:grabbing; box-shadow:0 10px 22px -6px var(--shadow); opacity:.95; }
  .tile.placed{ background:var(--success-soft); border-color:var(--success); cursor:default; }
  .tile.shake{ animation:shake .35s ease; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
  .round-msg{ text-align:center; font-weight:700; font-size:.92rem; margin-top:14px; min-height:1.4em; }
  .round-msg.ok{ color:var(--success); }
  button.reveal{ margin-top:14px; border:1.5px solid var(--primary); background:var(--surface); color:var(--primary); font-family:'Archivo',sans-serif; font-weight:700; font-size:.85rem; border-radius:10px; padding:.6em 1.3em; cursor:pointer; display:block; margin-left:auto; margin-right:auto; }
  button.reveal:hover{ background:var(--primary-soft); }
  button.reveal:disabled{ opacity:.35; cursor:default; }
  .final-card{ text-align:center; padding:30px 22px; }
  .final-card .big{ font-size:2.4rem; font-weight:900; font-family:'Archivo',sans-serif; color:var(--primary); }
  .progress-dots{ display:flex; gap:7px; justify-content:center; margin-bottom:6px; }
  .progress-dots span{ width:9px; height:9px; border-radius:50%; background:var(--line-strong); }
  .progress-dots span.done{ background:var(--success); }
  .progress-dots span.current{ background:var(--primary); }
  ::selection{ background:var(--primary-soft); }

  .theme-toggle{
    position:fixed; top:calc(14px + env(safe-area-inset-top, 0px)); right:calc(14px + env(safe-area-inset-right, 0px));
    z-index:9999; width:44px; height:44px; padding:0; display:flex; align-items:center; justify-content:center;
    border-radius:50%; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); cursor:pointer;
    box-shadow:0 10px 24px -10px var(--shadow), 0 1px 0 var(--shadow-soft);
    transition:transform .15s ease, background .2s ease, color .2s ease;
  }
  .theme-toggle:hover{ transform:scale(1.07); }
  .theme-toggle:active{ transform:scale(.92); }
  .theme-toggle svg{ width:20px; height:20px; }
  .theme-toggle svg[hidden]{ display:none; }
  @media (max-width:640px){
    .theme-toggle{ width:40px; height:40px; }
    .theme-toggle svg{ width:18px; height:18px; }
    .score-pill{ float:none; display:block; width:fit-content; margin:0 auto 16px; }
    .slot{ width:60px; height:56px; }
    .tile{ width:54px; height:44px; font-size:.85rem; }
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<button type="button" id="themeToggle" class="theme-toggle" aria-label="Mudar para modo claro" title="Alternar tema claro/escuro">
  <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
  <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
</button>

<div class="app">
  <div class="score-pill">Acertos: <span id="scoreVal">0</span>/<span id="scoreTotal">25</span></div>
  <header class="top">
    <div class="eyebrow">Atividade extra · Arraste e monte</div>
    <h1>Monte a P.A.</h1>
    <p class="subtitle">Cada rodada mostra a<sub>1</sub> e a razão r de uma progressão aritmética. Arraste cada valor da caixa para a posição correta na trilha, usando a<sub>n</sub> = a<sub>1</sub> + (n − 1)·r para descobrir onde ele entra.</p>
  </header>

  <div class="progress-dots" id="dots"></div>

  <div class="card" id="gameCard">
    <div class="round-title" id="roundTitle"></div>
    <div class="round-sub" id="roundSub"></div>
    <div class="track" id="track"></div>
    <div class="pool" id="pool"></div>
    <div class="round-msg" id="roundMsg"></div>
    <button class="reveal" id="nextBtn" style="display:none;">Próxima rodada →</button>
  </div>

  <div class="card final-card" id="finalCard" style="display:none;">
    <div class="eyebrow">Fim do jogo</div>
    <div class="big"><span id="finalScore">0</span>/<span id="finalTotal">25</span></div>
    <p id="finalMsg" style="max-width:48ch;margin:10px auto 0;"></p>
  </div>
</div>

<script>
(function(){
  var root = document.documentElement;
  var btn = document.getElementById('themeToggle');
  if(!btn) return;
  var sunIcon = btn.querySelector('.i-sun');
  var moonIcon = btn.querySelector('.i-moon');
  var KEY = 'theme-pref-pa1-criativa';
  function systemTheme(){ try{ return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }catch(e){ return 'dark'; } }
  function getStored(){ try{ return localStorage.getItem(KEY); }catch(e){ return null; } }
  function setStored(v){ try{ localStorage.setItem(KEY, v); }catch(e){} }
  function apply(theme){
    root.setAttribute('data-theme', theme);
    var isDark = theme === 'dark';
    if(isDark){ sunIcon.removeAttribute("hidden"); moonIcon.setAttribute("hidden",""); }
    else{ sunIcon.setAttribute("hidden",""); moonIcon.removeAttribute("hidden"); }
    btn.setAttribute('aria-label', isDark ? 'Mudar para modo claro' : 'Mudar para modo escuro');
  }
  apply(getStored() || systemTheme());
  btn.addEventListener('click', function(){
    var current = root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    var next = current === 'dark' ? 'light' : 'dark';
    apply(next); setStored(next);
  });
})();
</script>

<script>
(function(){
  var ROUNDS = [
    { a1:2,   r:3,   n:4, label:'Rodada 1 · aquecendo' },
    { a1:20,  r:-4,  n:5, label:'Rodada 2 · razão negativa' },
    { a1:-5,  r:6,   n:5, label:'Rodada 3 · começando negativo' },
    { a1:1,   r:2.5, n:5, label:'Rodada 4 · razão decimal' },
    { a1:50,  r:-15, n:6, label:'Rodada 5 · desafio final' }
  ];

  function fmt(v){
    var r = Math.round(v*100)/100;
    return (r % 1 === 0) ? String(r) : String(r).replace('.', ',');
  }
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
    }
    return a;
  }

  var totalSlots = ROUNDS.reduce(function(s,r){ return s+r.n; }, 0);
  document.getElementById('scoreTotal').textContent = totalSlots;
  document.getElementById('finalTotal').textContent = totalSlots;

  var score = 0;
  var mistakes = 0;
  var roundIdx = 0;

  var dotsEl = document.getElementById('dots');
  ROUNDS.forEach(function(){
    var d = document.createElement('span');
    dotsEl.appendChild(d);
  });
  function updateDots(){
    Array.prototype.forEach.call(dotsEl.children, function(d,i){
      d.className = i < roundIdx ? 'done' : (i === roundIdx ? 'current' : '');
    });
  }

  var trackEl = document.getElementById('track');
  var poolEl = document.getElementById('pool');
  var roundTitle = document.getElementById('roundTitle');
  var roundSub = document.getElementById('roundSub');
  var roundMsg = document.getElementById('roundMsg');
  var nextBtn = document.getElementById('nextBtn');
  var scoreVal = document.getElementById('scoreVal');

  var dragEl = null, dragOffX=0, dragOffY=0, filledCount=0, roundConfig=null;

  function buildRound(){
    roundConfig = ROUNDS[roundIdx];
    filledCount = 0;
    trackEl.innerHTML = ''; poolEl.innerHTML = ''; roundMsg.textContent = ''; roundMsg.className = 'round-msg';
    nextBtn.style.display = 'none';
    updateDots();

    var terms = [];
    for(var i=0;i<roundConfig.n;i++){ terms.push(roundConfig.a1 + i*roundConfig.r); }

    roundTitle.textContent = roundConfig.label;
    roundSub.innerHTML = 'a<sub>1</sub> = ' + fmt(roundConfig.a1) + '  ·  r = ' + fmt(roundConfig.r) + '  ·  ' + roundConfig.n + ' termos — arraste cada valor para a posição certa.';

    for(var p=1;p<=roundConfig.n;p++){
      var slot = document.createElement('div');
      slot.className = 'slot';
      slot.dataset.pos = p;
      var lab = document.createElement('span');
      lab.className = 'slot-pos';
      lab.textContent = 'a' + p;
      slot.appendChild(lab);
      trackEl.appendChild(slot);
    }

    var shuffled = shuffle(terms.map(function(v,idx){ return {value:v, pos:idx+1}; }));
    shuffled.forEach(function(item){
      var tile = document.createElement('div');
      tile.className = 'tile';
      tile.textContent = fmt(item.value);
      tile.dataset.pos = item.pos;
      attachDrag(tile);
      poolEl.appendChild(tile);
    });
  }

  function attachDrag(tile){
    tile.addEventListener('pointerdown', function(e){
      if(tile.classList.contains('placed')) return;
      e.preventDefault();
      var rect = tile.getBoundingClientRect();
      dragEl = tile;
      dragOffX = e.clientX - rect.left;
      dragOffY = e.clientY - rect.top;
      tile.style.width = rect.width+'px';
      tile.style.height = rect.height+'px';
      tile.classList.add('dragging');
      tile.style.left = rect.left+'px';
      tile.style.top = rect.top+'px';
      try{ tile.setPointerCapture(e.pointerId); }catch(err){}
    });
    tile.addEventListener('pointermove', function(e){
      if(dragEl !== tile) return;
      tile.style.left = (e.clientX - dragOffX)+'px';
      tile.style.top = (e.clientY - dragOffY)+'px';
      clearHovers();
      var target = elementUnder(e.clientX, e.clientY, tile);
      var slot = target ? target.closest('.slot') : null;
      if(slot && !slot.classList.contains('filled')) slot.classList.add('hover-ok');
    });
    tile.addEventListener('pointerup', function(e){
      if(dragEl !== tile) return;
      dragEl = null;
      clearHovers();
      var target = elementUnder(e.clientX, e.clientY, tile);
      var slot = target ? target.closest('.slot') : null;
      tile.classList.remove('dragging');
      tile.style.left=''; tile.style.top=''; tile.style.width=''; tile.style.height='';
      if(slot && !slot.classList.contains('filled') && String(slot.dataset.pos) === String(tile.dataset.pos)){
        slot.appendChild(tile);
        slot.classList.add('filled');
        tile.classList.add('placed');
        filledCount++;
        score++;
        scoreVal.textContent = score;
        if(filledCount === roundConfig.n) roundComplete();
      } else {
        mistakes++;
        tile.classList.add('shake');
        setTimeout(function(){ tile.classList.remove('shake'); }, 360);
      }
    });
  }

  function clearHovers(){
    Array.prototype.forEach.call(document.querySelectorAll('.slot.hover-ok'), function(s){ s.classList.remove('hover-ok'); });
  }
  function elementUnder(x,y,exclude){
    exclude.style.pointerEvents = 'none';
    var el = document.elementFromPoint(x,y);
    exclude.style.pointerEvents = '';
    return el;
  }

  function roundComplete(){
    roundMsg.textContent = '✔ Sequência completa! ' + roundConfig.n + '/' + roundConfig.n + ' na primeira tentativa desta rodada.';
    roundMsg.className = 'round-msg ok';
    if(roundIdx === ROUNDS.length-1){
      nextBtn.textContent = 'Ver resultado final';
    } else {
      nextBtn.textContent = 'Próxima rodada →';
    }
    nextBtn.style.display = 'block';
  }

  nextBtn.addEventListener('click', function(){
    roundIdx++;
    if(roundIdx >= ROUNDS.length){
      finish();
    } else {
      buildRound();
    }
  });

  function finish(){
    updateDots();
    document.getElementById('gameCard').style.display = 'none';
    var finalCard = document.getElementById('finalCard');
    var finalScore = document.getElementById('finalScore');
    var finalMsg = document.getElementById('finalMsg');
    var perfScore = Math.max(0, totalSlots - mistakes);
    finalScore.textContent = perfScore;
    var pct = perfScore/totalSlots;
    var msg;
    if(mistakes === 0) msg = 'Perfeito! Você encaixou todos os termos de primeira — domina completamente a fórmula do termo geral.';
    else if(pct >= 0.8) msg = 'Muito bom! Poucos deslizes (' + mistakes + ') — sua noção de posição e razão está sólida.';
    else if(pct >= 0.5) msg = 'Bom trabalho, com ' + mistakes + ' deslizes. Repita as rodadas com razão negativa e decimal para ganhar confiança.';
    else msg = 'Você terminou com ' + mistakes + ' deslizes. Vale a pena jogar de novo depois de revisar a fórmula an = a1 + (n-1)·r.';
    finalMsg.textContent = msg;
    finalCard.style.display = 'block';
    finalCard.scrollIntoView({behavior:'smooth', block:'center'});
    if(window.reportarConclusao) window.reportarConclusao(perfScore, totalSlots);
  }

  buildRound();
})();
</script>

<script>
(function(){
  try{ window.parent.postMessage({type:'lesson-progress', event:'opened'}, '*'); }catch(e){}
  window.reportarConclusao = function(score, total){
    try{ window.parent.postMessage({type:'lesson-progress', event:'quiz-completed', score:score, total:total}, '*'); }catch(e){}
  };
})();
</script>
