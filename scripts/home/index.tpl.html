<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prof. Eduardo — Aulas e Guias</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#382EAE">
<meta name="description" content="Aulas interativas, guias visuais e atividades de Matemática, Educação Financeira e preparação para o ENA/PROFMAT.">
<!--ICON-->
<link href="assets/fonts.css" rel="stylesheet">
<link rel="stylesheet" href="app/home.css">
</head>
<body>

<button type="button" id="themeToggle" class="theme-toggle" aria-label="Mudar para modo claro (ideal para projetor)" title="Alternar tema claro/escuro">
<!--THEMEICONS-->
</button>

<a class="skip" href="#painel">Ir para o conteúdo</a>

<header class="topbar">
  <div class="wrap bar">
    <a class="brand" href="./" aria-label="Início"><span class="dot"></span><span>Prof. Eduardo</span></a>
    <label class="search" aria-label="Buscar aulas, guias e atividades">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar em todas as matérias…" autocomplete="off">
      <kbd aria-hidden="true">/</kbd>
    </label>
    <a href="login.html" class="login-link">Entrar <span class="hide-sm">· aluno / professor</span></a>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <h1 class="title" id="saudacao">O que vamos estudar hoje?</h1>
    <p class="lede">Escolha a matéria, abra o módulo e comece. Seu progresso fica salvo neste aparelho.</p>
    <div class="continuar" id="continuar"></div>
  </div>
</section>

<main class="wrap" id="main">
  <nav class="subjects" id="subjects" role="tablist" aria-label="Matérias"></nav>

  <section class="panel" id="painel" tabindex="-1" aria-live="polite"></section>

  <section class="tools" aria-label="Ferramentas de estudo">
    <a class="tool" href="simulado.html"><span class="ic" aria-hidden="true">📝</span><span><b>Simulados</b><small>Treine com questões das aulas</small></span></a>
    <a class="tool" href="revisao.html"><span class="ic" aria-hidden="true">🔁</span><span><b>Revisão <i class="n" id="revN" hidden></i></b><small>Repetição espaçada dos seus erros</small></span></a>
    <button class="tool" type="button" id="btnConq"><span class="ic" aria-hidden="true">🏆</span><span><b>Conquistas</b><small>Seu progresso e sequência de dias</small></span></button>
    <button class="tool" type="button" id="btnInstalar" hidden><span class="ic" aria-hidden="true">⬇</span><span><b>Instalar app</b><small>Use offline, como aplicativo</small></span></button>
  </section>
</main>

<!--KEEPHTML-->

<script type="module">
import { MATERIAS, ICONS } from './app/catalog.js';
(function(){
  var LAST_UPDATED = '2026-10-09'; // atualize ao publicar conteúdo novo
  var ACENTOS = ['primary', 'growth', 'decay', 'success'];

  function svgIcon(name){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || ICONS['grid']) + '</svg>';
  }
  var ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
  var CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
  function el(tag, cls, html){ var e = document.createElement(tag); if(cls) e.className = cls; if(html !== undefined) e.innerHTML = html; return e; }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function jl(k, d){ try{ var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; }catch(e){ return d; } }
  function js(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

  // ---- progresso local (gravado pelas próprias páginas, sem login) ----
  function prog(arq){ try{ return JSON.parse(localStorage.getItem('prog:' + arq) || 'null'); }catch(e){ return null; } }
  function norm(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function tipoDe(item){ return item.tipo === 'Atividade' ? 'atividade' : item.tipo === 'Guia' ? 'guia' : 'aula'; }
  function visto(item){ var p = prog(item.arquivo); return !!(p && p.v); }

  // anos em ordem crescente (9º → 2º → 3º; Parte 1 → 5)
  function ordemAno(a){ var n = /(\d+)/.exec(a.ano); return n ? (/Parte/.test(a.ano) || +n[1] >= 6 ? +n[1] : +n[1] + 10) : 99; }
  MATERIAS.forEach(function(m){ m.CATALOG.sort(function(a, b){ return ordemAno(a) - ordemAno(b); }); });

  var estado = { q: '', tipo: 'todos', idx: 0, ano: 0 };
  var subjectsRoot = document.getElementById('subjects');
  var painel = document.getElementById('painel');
  var qEl = document.getElementById('q');

  // ---- contagens ----
  function contaUnidade(u){
    var c = { aulas: 0, guias: 0, ativ: 0, vistos: 0, total: u.itens.length, mod: u.itens.length ? 1 : 0 };
    u.itens.forEach(function(i){ var t = tipoDe(i); if(t === 'aula') c.aulas++; else if(t === 'guia') c.guias++; else c.ativ++; if(visto(i)) c.vistos++; });
    return c;
  }
  function contaAno(a){
    var c = { aulas: 0, guias: 0, ativ: 0, vistos: 0, total: 0, mods: 0 };
    a.trimestres.forEach(function(t){ t.unidades.forEach(function(u){ var k = contaUnidade(u); c.aulas += k.aulas; c.guias += k.guias; c.ativ += k.ativ; c.vistos += k.vistos; c.total += k.total; c.mods += k.mod; }); });
    return c;
  }
  function contaMateria(m){
    var c = { aulas: 0, guias: 0, ativ: 0, vistos: 0, total: 0, mods: 0 };
    m.CATALOG.forEach(function(a){ var k = contaAno(a); for(var x in c) c[x] += k[x]; });
    return c;
  }
  function plural(n, s, p){ return n + ' ' + (n === 1 ? s : p); }
  function resumo(c){
    var p = [];
    if(c.aulas) p.push(plural(c.aulas, 'aula', 'aulas'));
    if(c.guias) p.push(plural(c.guias, 'guia', 'guias'));
    if(c.ativ) p.push(plural(c.ativ, 'atividade', 'atividades'));
    return p.join(' · ');
  }
  function barra(v, t){ return '<span class="bar-prog" role="img" aria-label="' + v + ' de ' + t + ' vistos"><i style="width:' + (t ? Math.round(v / t * 100) : 0) + '%"></i></span>'; }

  // ---- estado dos módulos abertos (lembrado entre visitas) ----
  var abertos = jl('home:abertos', {});
  function chave(m, a, u){ return m.id + '|' + a.ano + '|' + u.titulo; }
  function lembrar(k, on){ if(on) abertos[k] = 1; else abertos[k] = 0; js('home:abertos', abertos); }

  // ---- seleção de matéria / ano e link direto (#matematica/1) ----
  function lerHash(){
    var h = location.hash.replace('#', '').split('/');
    var i = MATERIAS.findIndex(function(m){ return m.id === h[0]; });
    if(i < 0) return null;
    var a = parseInt(h[1], 10);
    return { idx: i, ano: isNaN(a) ? null : Math.max(0, Math.min(MATERIAS[i].CATALOG.length - 1, a)) };
  }
  function gravarHash(){ try{ history.replaceState(null, '', '#' + MATERIAS[estado.idx].id + '/' + estado.ano); }catch(e){} }
  function anoSalvo(i){ var v = jl('home:ano:' + MATERIAS[i].id, null); return v == null ? null : Math.max(0, Math.min(MATERIAS[i].CATALOG.length - 1, v)); }
  function escolheMateria(i, ano){
    estado.idx = i;
    estado.ano = ano != null ? ano : (anoSalvo(i) != null ? anoSalvo(i) : anoInicial(i));
    try{ localStorage.setItem('materia-pref', MATERIAS[i].id); }catch(e){}
    gravarHash(); renderTudo();
  }
  function escolheAno(a){ estado.ano = a; js('home:ano:' + MATERIAS[estado.idx].id, a); gravarHash(); renderTudo(); }
  // ano inicial: o primeiro que ainda tem aula não vista
  function anoInicial(i){
    var m = MATERIAS[i];
    for(var a = 0; a < m.CATALOG.length; a++){ var c = contaAno(m.CATALOG[a]); if(c.vistos < c.total) return a; }
    return 0;
  }

  // ---- barra de matérias (abas grandes) ----
  function renderMaterias(){
    subjectsRoot.innerHTML = '';
    MATERIAS.forEach(function(m, i){
      var c = contaMateria(m), on = i === estado.idx;
      var b = el('button', 'subject' + (on ? ' active' : ''));
      b.type = 'button'; b.id = 'tab-m' + i; b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1;
      b.setAttribute('aria-controls', 'painel');
      b.style.setProperty('--accent', 'var(--' + ACENTOS[i % ACENTOS.length] + ')');
      b.style.setProperty('--accent-soft', 'var(--' + ACENTOS[i % ACENTOS.length] + '-soft)');
      b.innerHTML = '<span class="s-ic">' + svgIcon(m.icon) + '</span><span class="s-tx"><b>' + esc(m.nome) + '</b><small>' + (c.total ? plural(c.mods, 'módulo', 'módulos') + ' · ' + plural(c.aulas, 'aula', 'aulas') : 'Em breve') + '</small></span>' + barra(c.vistos, c.total) + '<span class="s-pc">' + (c.total ? Math.round(c.vistos / c.total * 100) : 0) + '%</span>';
      b.addEventListener('click', function(){ if(estado.q){ limpaBusca(); } escolheMateria(i); });
      subjectsRoot.appendChild(b);
    });
  }

  // ---- filtros ----
  function passa(item, unidade){
    var busca = norm(estado.q.trim());
    if(estado.tipo === 'pend'){ if(visto(item)) return false; }
    else if(estado.tipo !== 'todos' && estado.tipo !== tipoDe(item)) return false;
    if(busca && norm(item.titulo + ' ' + (item.sub || '') + ' ' + item.tipo + ' ' + unidade.titulo).indexOf(busca) < 0) return false;
    return true;
  }

  // ---- módulo (unidade) ----
  function itemLink(item, rotulo){
    var a = el('a', 'item'), p = prog(item.arquivo), marca = '';
    a.href = item.arquivo;
    if(p && p.v){ a.classList.add('done'); marca = '<span class="prog" title="visto neste aparelho' + (p.t ? ' · melhor nota ' + p.s + '/' + p.t : '') + '">' + (p.t ? p.s + '/' + p.t : '✓') + '</span>'; }
    a.innerHTML = '<span class="badge">' + esc(rotulo) + '</span><span class="txt">' + item.titulo + '</span>' + marca + '<span class="arrow">' + ARROW + '</span>';
    return a;
  }
  function grupo(titulo, itens, rotuloFn){
    if(!itens.length) return null;
    var g = el('div', 'grupo');
    g.appendChild(el('div', 'g-tit', titulo + ' <span>' + itens.length + '</span>'));
    var l = el('div', 'item-list');
    itens.forEach(function(i){ l.appendChild(itemLink(i, rotuloFn(i))); });
    g.appendChild(l); return g;
  }
  function modulo(m, a, tri, u, num, o){
    if(!u.itens.length){
      if(estado.tipo !== 'todos' || norm(estado.q.trim())) return null;
      var v = el('div', 'mod vazia');
      v.style.setProperty('--accent', 'var(--' + u.accent + ')'); v.style.setProperty('--accent-soft', 'var(--' + u.accent + '-soft)');
      v.innerHTML = '<div class="vz"><span class="m-ic">' + svgIcon(u.icon) + '</span><span class="m-tx"><span class="m-n">Módulo ' + String(num).padStart(2, '0') + '</span><b>' + esc(u.titulo) + '</b><small>Em breve</small></span></div>';
      return v;
    }
    var visiveis = u.itens.filter(function(i){ return passa(i, u); });
    if(!visiveis.length) return null;
    var c = contaUnidade(u), k = chave(m, a, u);
    var d = el('details', 'mod'); d.dataset.k = k;
    d.style.setProperty('--accent', 'var(--' + u.accent + ')'); d.style.setProperty('--accent-soft', 'var(--' + u.accent + '-soft)');
    var aberto = o.forcaAberto || abertos[k] === 1 || (abertos[k] == null && o.sugerido === u);
    d.open = !!aberto;
    var feito = c.vistos === c.total && c.total > 0;
    var s = el('summary', null,
      '<span class="m-ic">' + svgIcon(u.icon) + '</span>' +
      '<span class="m-tx"><span class="m-n">Módulo ' + String(num).padStart(2, '0') + (feito ? ' · <em>concluído ✓</em>' : '') + '</span><b>' + esc(u.titulo) + '</b><small>' + resumo(c) + '</small></span>' +
      '<span class="m-pr">' + barra(c.vistos, c.total) + '<span>' + c.vistos + '/' + c.total + '</span></span>' +
      '<span class="chev">' + CHEV + '</span>');
    d.appendChild(s);
    var body = el('div', 'mod-body');
    var aulas = visiveis.filter(function(i){ return tipoDe(i) === 'aula'; }), guias = visiveis.filter(function(i){ return tipoDe(i) === 'guia'; }), ativ = visiveis.filter(function(i){ return tipoDe(i) === 'atividade'; });
    [grupo('Aulas', aulas, function(i){ return i.tipo; }), grupo('Guia visual', guias, function(i){ return i.tipo; }), grupo('Atividades', ativ, function(i){ return i.sub || 'Atividade'; })].forEach(function(g){ if(g) body.appendChild(g); });
    var rv = u.revisado || m.revisado || '2026-09-22';
    var meses = (Date.now() - new Date(rv + 'T00:00:00').getTime()) / 2592e6;
    body.appendChild(el('div', 'rev-flag' + (meses > 6 ? ' velho' : ''), 'conteúdo revisado em ' + new Date(rv + 'T00:00:00').toLocaleDateString('pt-BR', { month: 'short', year: 'numeric' }) + (meses > 6 ? ' · precisa de revisão' : '')));
    d.appendChild(body);
    d.addEventListener('toggle', function(){ if(!o.forcaAberto) lembrar(k, d.open); });
    return d;
  }

  // ---- painel da matéria ----
  function renderPainel(){
    var m = MATERIAS[estado.idx], a = m.CATALOG[estado.ano];
    painel.innerHTML = '';
    painel.setAttribute('role', 'tabpanel'); painel.setAttribute('aria-labelledby', 'tab-m' + estado.idx);
    painel.style.setProperty('--accent', 'var(--' + ACENTOS[estado.idx % ACENTOS.length] + ')');
    painel.style.setProperty('--accent-soft', 'var(--' + ACENTOS[estado.idx % ACENTOS.length] + '-soft)');

    var topo = el('div', 'p-head');
    topo.appendChild(el('p', 'p-lede', esc(m.lede) + (m.emBreve ? ' <b>Conteúdo em preparação.</b>' : '')));
    if(m.destaque){ var da = el('a', 'destaque', '<small>★ Comece por aqui</small><b>' + esc(m.destaque.titulo) + '</b><span>' + esc(m.destaque.texto) + '</span>'); da.href = m.destaque.url; topo.appendChild(da); }
    painel.appendChild(topo);

    // abas de ano / parte
    var tabs = el('div', 'years'); tabs.setAttribute('role', 'tablist'); tabs.setAttribute('aria-label', 'Ano / parte');
    m.CATALOG.forEach(function(an, i){
      var c = contaAno(an), on = i === estado.ano;
      var b = el('button', 'year' + (on ? ' active' : ''), '<b>' + esc(an.ano) + '</b><small>' + (c.total ? c.vistos + '/' + c.total : 'em breve') + '</small>');
      b.type = 'button'; b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1;
      b.addEventListener('click', function(){ escolheAno(i); });
      tabs.appendChild(b);
    });
    painel.appendChild(tabs); teclasAbas(tabs); teclasAbas(subjectsRoot);

    // barra de filtros
    var f = el('div', 'filtros');
    [['todos', 'Tudo'], ['aula', 'Aulas'], ['guia', 'Guias'], ['atividade', 'Atividades'], ['pend', 'Ainda não vistos']].forEach(function(t){
      var b = el('button', 'fchip' + (estado.tipo === t[0] ? ' on' : ''), t[1]); b.type = 'button';
      b.addEventListener('click', function(){ estado.tipo = (estado.tipo === t[0] && t[0] !== 'todos') ? 'todos' : t[0]; renderPainel(); });
      f.appendChild(b);
    });
    f.appendChild(el('span', 'sp'));
    var ex = el('button', 'lnk', 'Expandir tudo'), re = el('button', 'lnk', 'Recolher tudo'); ex.type = re.type = 'button';
    ex.addEventListener('click', function(){ painel.querySelectorAll('details.mod').forEach(function(d){ d.open = true; }); });
    re.addEventListener('click', function(){ painel.querySelectorAll('details.mod').forEach(function(d){ d.open = false; }); });
    f.appendChild(ex); f.appendChild(re);
    painel.appendChild(f);

    // módulos
    var lista = el('div', 'mods'), n = 0, exibidos = 0, sug = sugerida(estado.idx);
    var multi = a.trimestres.length > 1, forca = estado.tipo !== 'todos';
    a.trimestres.forEach(function(tri){
      var visTri = tri.unidades.filter(function(u){ return u.itens.length ? u.itens.some(function(i){ return passa(i, u); }) : (estado.tipo === 'todos' && !norm(estado.q.trim())); });
      if(!visTri.length) return;
      if(multi) lista.appendChild(el('h3', 'tri-tit', esc(tri.nome)));
      tri.unidades.forEach(function(u, ui){
        var d = modulo(m, a, tri, u, ++n, { forcaAberto: forca, sugerido: sug && sug.unidade === u ? u : null });
        if(d){ lista.appendChild(d); exibidos++; }
      });
    });
    if(!exibidos){
      var v = el('div', 'vazio', 'Nada encontrado com esse filtro.'); var lb = el('button', 'fchip', 'Limpar filtro'); lb.type = 'button';
      lb.addEventListener('click', function(){ estado.tipo = 'todos'; renderPainel(); }); v.appendChild(lb); lista.appendChild(v);
    }
    var tri0 = a.trimestres[0];
    if(!multi && tri0) lista.insertAdjacentHTML('afterbegin', '<p class="tri-sub">' + esc(tri0.nome) + ' · ' + plural(contaAno(a).mods, 'módulo', 'módulos') + ' · ' + resumo(contaAno(a)) + '</p>');
    painel.appendChild(lista);
  }

  // ---- busca (todas as matérias) ----
  function renderBusca(){
    painel.innerHTML = ''; painel.removeAttribute('aria-labelledby');
    painel.style.setProperty('--accent', 'var(--primary)'); painel.style.setProperty('--accent-soft', 'var(--primary-soft)');
    var lista = el('div', 'mods'), total = 0, mods = 0;
    MATERIAS.forEach(function(m){
      m.CATALOG.forEach(function(a){
        var n = 0, blocos = [];
        a.trimestres.forEach(function(tri){ tri.unidades.forEach(function(u){
          n++; var d = modulo(m, a, tri, u, n, { forcaAberto: true }); if(d){ blocos.push(d); mods++; total += u.itens.filter(function(i){ return passa(i, u); }).length; }
        }); });
        if(blocos.length){ lista.appendChild(el('h3', 'tri-tit', esc(m.nome) + ' · ' + esc(a.ano))); blocos.forEach(function(b){ lista.appendChild(b); }); }
      });
    });
    var head = el('div', 'p-head');
    head.appendChild(el('p', 'p-lede', total ? '<b>' + plural(total, 'resultado', 'resultados') + '</b> para “' + esc(estado.q.trim()) + '” em ' + plural(mods, 'módulo', 'módulos') + '.' : ''));
    var lim = el('button', 'lnk', 'Limpar busca ✕'); lim.type = 'button'; lim.addEventListener('click', limpaBusca); head.appendChild(lim);
    painel.appendChild(head);
    if(!total){ var v = el('div', 'vazio', 'Nada encontrado para “' + esc(estado.q.trim()) + '”. Tente outra palavra (ex.: “juros”, “função”, “triângulo”).'); painel.appendChild(v); }
    else painel.appendChild(lista);
  }
  function limpaBusca(){ estado.q = ''; qEl.value = ''; renderTudo(); }

  function renderTudo(){
    var buscando = !!norm(estado.q.trim());
    subjectsRoot.classList.toggle('dim', buscando);
    renderMaterias();
    if(buscando) renderBusca(); else renderPainel();
    renderContinuar(); marcadores();
  }

  // acessibilidade: setas esquerda/direita nas abas
  function teclasAbas(box){
    if(box.dataset.k) return; box.dataset.k = 1;
    box.addEventListener('keydown', function(e){
      if(e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      var tabs = [].slice.call(box.querySelectorAll('[role=tab]')), i = tabs.indexOf(document.activeElement); if(i < 0) return;
      var j = (i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length; tabs[j].focus(); tabs[j].click(); e.preventDefault();
      setTimeout(function(){ var t = box.querySelectorAll('[role=tab]')[j]; if(t) t.focus(); }, 0);
    });
  }

/*KEEP1*/

  // busca
  var qTimer = null;
  qEl.addEventListener('input', function(){ clearTimeout(qTimer); qTimer = setTimeout(function(){ estado.q = qEl.value; renderTudo(); }, 140); });
  document.addEventListener('keydown', function(e){
    if(e.key === '/' && document.activeElement !== qEl && !/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '')){ e.preventDefault(); qEl.focus(); }
    if(e.key === 'Escape' && document.activeElement === qEl){ limpaBusca(); qEl.blur(); }
  });
  window.addEventListener('pageshow', function(e){ if(e.persisted) renderTudo(); });
  window.addEventListener('hashchange', function(){ var h = lerHash(); if(h && (h.idx !== estado.idx || (h.ano != null && h.ano !== estado.ano))){ estado.idx = h.idx; estado.ano = h.ano != null ? h.ano : anoInicial(h.idx); renderTudo(); } });

  // saudação conforme o horário
  var hr = new Date().getHours();
  document.getElementById('saudacao').textContent = (hr < 5 ? 'Boa madrugada!' : hr < 12 ? 'Bom dia!' : hr < 18 ? 'Boa tarde!' : 'Boa noite!') + ' O que vamos estudar hoje?';

  // matéria inicial: link direto → última usada → primeira
  var ini = lerHash(), idx0 = 0;
  if(ini){ idx0 = ini.idx; }
  else { try{ var sm = localStorage.getItem('materia-pref'); var f = MATERIAS.findIndex(function(m){ return m.id === sm; }); if(f >= 0) idx0 = f; }catch(e){} }
  estado.idx = idx0;
  estado.ano = ini && ini.ano != null ? ini.ano : (anoSalvo(idx0) != null ? anoSalvo(idx0) : anoInicial(idx0));
